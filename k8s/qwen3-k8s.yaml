apiVersion: v1
kind: Namespace
metadata:
  name: qwen-inference
---
# 1. Model Storage (Mounting host /root/Qwen3-32B folder)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qwen3-model-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: /root/Qwen3-32B
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-model-pvc
  namespace: qwen-inference
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: local-storage
  resources:
    requests:
      storage: 100Gi
---
# 2. vLLM Server Deployment & Service (1x NVIDIA A100 GPU + Shared Memory)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen3-32b
  namespace: qwen-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen3-32b
  template:
    metadata:
      labels:
        app: vllm-qwen3-32b
    spec:
      containers:
      - name: vllm
        image: qwen3-32b-vllm:a100
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
        - --model=/model
        - --served-model-name=Qwen3-32B
        - --tensor-parallel-size=1
        - --max-model-len=8192
        - --dtype=bfloat16
        - --gpu-memory-utilization=0.92
        - --trust-remote-code
        ports:
        - containerPort: 8000
          name: http-vllm
        resources:
          limits:
            nvidia.com/gpu: "1"
          requests:
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: model-weights
          mountPath: /model
        - name: dshm
          mountPath: /dev/shm
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 45
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 90
          periodSeconds: 20
      volumes:
      - name: model-weights
        persistentVolumeClaim:
          claimName: qwen3-model-pvc
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: qwen-inference
spec:
  selector:
    app: vllm-qwen3-32b
  ports:
  - port: 8000
    targetPort: 8000
    name: http-vllm
  type: ClusterIP
---
# 3. Chat UI Frontend Deployment & Service (NodePort 30080)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-frontend
  namespace: qwen-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-frontend
  template:
    metadata:
      labels:
        app: chat-frontend
    spec:
      containers:
      - name: nginx
        image: qwen3-chat-frontend:a100
        imagePullPolicy: IfNotPresent
        env:
        - name: UPSTREAM_HOST
          value: "vllm-service.qwen-inference.svc.cluster.local:8000"
        ports:
        - containerPort: 80
      volumes: []
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: qwen-inference
spec:
  selector:
    app: chat-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  type: NodePort
