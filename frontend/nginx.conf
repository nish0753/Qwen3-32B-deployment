server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  location /v1/ {
    proxy_pass http://vllm-qwen3-32b:8000/v1/;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /metrics {
    proxy_pass http://vllm-qwen3-32b:8000/metrics;
    proxy_buffering off;
    proxy_read_timeout 60s;
  }

  location /health {
    proxy_pass http://vllm-qwen3-32b:8000/health;
    proxy_buffering off;
  }
}
