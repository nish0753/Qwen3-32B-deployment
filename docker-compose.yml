services:
  vllm-qwen3-32b:
    build:
      context: ./vllm-qwen3-32b-image
      dockerfile: Dockerfile
    image: qwen3-32b-vllm:a100
    container_name: vllm-qwen3-32b
    ipc: host
    shm_size: '16gb'
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ${MODEL_PATH:-/root/Qwen3-32B}:/model
    environment:
      - TENSOR_PARALLEL_SIZE=1
      - DTYPE=bfloat16
      - MAX_MODEL_LEN=8192
      - GPU_MEMORY_UTILIZATION=0.92
      - SERVED_MODEL_NAME=Qwen3-32B
      # If using A100 40GB, uncomment below for 4-bit AWQ or 8-bit FP8:
      # - QUANTIZATION=awq
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  chat-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: qwen3-chat-frontend:a100
    container_name: chat-frontend
    restart: unless-stopped
    depends_on:
      - vllm-qwen3-32b
    ports:
      - "8080:80"
    environment:
      - UPSTREAM_HOST=vllm-qwen3-32b:8000
